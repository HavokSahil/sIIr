name: Android checks and release
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "ndk;27.0.12077973" "cmake;3.22.1"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Build host CQT test library
        run: cc -O3 -shared -fPIC native/ecqt/shirr_ecqt.c native/ecqt/pffft/pffft.c -lm -o /tmp/libshirr_ecqt.so
      - name: Test
        run: flutter test --no-pub
        env:
          SHIRR_ECQT_LIBRARY: /tmp/libshirr_ecqt.so
      - run: flutter build apk --release --no-pub
      - name: Prepare downloadable APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk sIIr-android.apk
          sha256sum sIIr-android.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sIIr-android
          path: |
            sIIr-android.apk
            SHA256SUMS
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "sIIr $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" sIIr-android.apk SHA256SUMS --clobber
